name: NVIDIA upstream NVK and NAK baseline
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/nvidia-mesa.yml'
      - 'backends/nvidia/**'
      - 'validation/nvidia/**'
      - 'validation/vulkan/shaders/pattern.*'
      - 'tools/check_nvkmd_alignment.py'
permissions:
  contents: read
jobs:
  linux-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install native NVK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build pkg-config cmake \
            python3-venv python3-mako python3-yaml python3-ply \
            clang-18 llvm-18-dev libclang-18-dev libclc-18-dev \
            libllvmspirvlib-18-dev libdrm-dev libelf-dev libexpat1-dev \
            libzstd-dev zlib1g-dev libvulkan-dev glslang-tools spirv-tools
          python3 -m venv --system-site-packages target/mesa-tools
          target/mesa-tools/bin/pip install meson==1.9.1
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt
          cargo +1.90.0 install bindgen-cli --version 0.72.1 --locked
          cargo +1.90.0 install cbindgen --version 0.29.0 --locked
      - name: Fetch fixed official source and verify before extraction
        run: |
          mkdir -p target/mesa
          python3 - <<'PY'
          import json, pathlib, subprocess
          lock = json.loads(pathlib.Path('backends/nvidia/mesa-source.json').read_text())
          archive = pathlib.Path('target/mesa/source.tar.xz')
          subprocess.run(['curl', '--fail', '--location', '--proto', '=https',
                          '--proto-redir', '=https', '--max-time', '180',
                          '--max-filesize', '134217728', '--noproxy', '*',
                          '--output', str(archive), lock['url']], check=True)
          import hashlib
          with archive.open('rb') as stream:
              digest = hashlib.file_digest(stream, 'sha256').hexdigest()
          if digest != lock['sha256']:
              raise SystemExit('Mesa archive checksum mismatch; refusing extraction')
          subprocess.run(['tar', '-xJf', str(archive), '-C', 'target/mesa'], check=True)
          compiler = pathlib.Path('target/mesa') / ('mesa-' + lock['version']) / 'src/nouveau/vulkan'
          import os, shutil
          shutil.copyfile('validation/nvidia/nak-pattern.c', compiler / 'metalvk-nak-pattern.c')
          # Build the metalvk side of the shared standard inside the pinned tree.
          shutil.copyfile('validation/nvidia/nvkmd-metalvk.c', compiler / 'metalvk-nvkmd-adapter.c')
          shutil.copyfile('backends/nvidia/src/transport.c', compiler / 'metalvk-transport.c')
          root = os.environ['GITHUB_WORKSPACE']
          overlay = pathlib.Path('validation/nvidia/nvkmd-metalvk.meson').read_text().replace('@METALVK_ROOT@', root)
          with (compiler / 'meson.build').open('a') as stream:
              stream.write('\n' + pathlib.Path('validation/nvidia/nak-pattern.meson').read_text())
              stream.write('\n' + overlay)
          PY
      - name: Check the transport standard against the pinned nvkmd header
        run: |
          python3 tools/check_nvkmd_alignment.py \
            --manifest backends/nvidia/nvkmd-alignment.json \
            --transport-header backends/nvidia/include/nvidia/transport.h \
            --transport-source backends/nvidia/src/transport.c \
            --mesa-header target/mesa/mesa-26.2.4/src/nouveau/vulkan/nvkmd/nvkmd.h \
            --mesa-version 26.2.4
      - name: Configure complete Linux NVK, not a Darwin substitute
        env:
          RUSTUP_TOOLCHAIN: '1.90.0'
          LLVM_CONFIG: llvm-config-18
          LIBCLANG_PATH: /usr/lib/llvm-18/lib
          CC: clang-18
          CXX: clang++-18
        run: |
          target/mesa-tools/bin/meson setup target/mesa/build target/mesa/mesa-26.2.4 \
            --buildtype=release -Dplatforms=[] -Dgallium-drivers=[] \
            -Dvulkan-drivers=nouveau -Dglx=disabled -Degl=disabled \
            -Dopengl=false -Dgles1=disabled -Dgles2=disabled \
            -Dvideo-codecs=[] -Dbuild-tests=true -Dllvm=enabled \
            -Dshared-llvm=enabled -Dmesa-clc=enabled
      - name: Build full ICD and compiler test executables
        env:
          RUSTUP_TOOLCHAIN: '1.90.0'
          LIBCLANG_PATH: /usr/lib/llvm-18/lib
        run: target/mesa-tools/bin/meson compile -C target/mesa/build -j 4
      - name: Run CPU-only Nouveau compiler and command tests
        env:
          RUSTUP_TOOLCHAIN: '1.90.0'
        run: target/mesa-tools/bin/meson test -C target/mesa/build --suite nouveau --print-errorlogs
      - name: Verify actual ICD symbols and dependencies
        run: |
          test -s target/mesa/build/src/nouveau/vulkan/libvulkan_nouveau.so
          nm -D target/mesa/build/src/nouveau/vulkan/libvulkan_nouveau.so | grep vk_icdGetInstanceProcAddr
          ldd target/mesa/build/src/nouveau/vulkan/libvulkan_nouveau.so
          cp backends/nvidia/mesa-source.json target/mesa/build/
      - name: Compile repository graphics shaders into actual Ada instructions
        run: |
          for stage in vert frag; do
            glslangValidator -V --target-env vulkan1.2 \
              -o "target/mesa/build/pattern.$stage.spv" "validation/vulkan/shaders/pattern.$stage"
            spirv-val --target-env vulkan1.2 "target/mesa/build/pattern.$stage.spv"
          done
          timeout 60 target/mesa/build/src/nouveau/vulkan/metalvk-nak-pattern \
            target/mesa/build/pattern.vert.spv target/mesa/build/pattern.frag.spv \
            | tee target/mesa/build/nak-pattern.log
          python3 - <<'PY'
          import pathlib, subprocess
          root = pathlib.Path('target/mesa/build')
          exe = str(root / 'src/nouveau/vulkan/metalvk-nak-pattern')
          fragment = str(root / 'pattern.frag.spv')
          cases = [('empty', b''), ('partial', bytes(19)), ('wrong-magic', bytes(20)),
                   ('oversized', b'\x03\x02\x23\x07' + bytes(1048576))]
          result = subprocess.run([exe], capture_output=True, timeout=60)
          assert result.returncode == 2, result.returncode
          for name, data in cases:
              path = root / ('invalid-' + name + '.spv')
              path.write_bytes(data)
              result = subprocess.run([exe, str(path), fragment], capture_output=True, timeout=60)
              assert result.returncode == 1, (name, result.returncode)
          result = subprocess.run([exe, str(root / 'missing-input.spv'), fragment],
                                  capture_output=True, timeout=60)
          assert result.returncode == 1, result.returncode
          print('PASS offline compiler argument, missing-file, truncated, magic and size rejection')
          PY
      - name: Run the user-space nvkmd adapter conformance client
        run: |
          timeout 60 target/mesa/build/src/nouveau/vulkan/metalvk-nvkmd-adapter \
            | tee target/mesa/build/nvkmd-adapter.log
      - name: Preserve baseline diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nvidia-mesa-linux-baseline
          path: |
            target/mesa/build/meson-logs/
            target/mesa/build/mesa-source.json
            target/mesa/build/src/nouveau/vulkan/libvulkan_nouveau.so
            target/mesa/build/src/nouveau/vulkan/*icd*.json
            target/mesa/build/nak-pattern.log
            target/mesa/build/nvkmd-adapter.log
            target/mesa/build/pattern.*.spv
            target/mesa/mesa-26.2.4/docs/license*
            target/mesa/source.tar.xz
            target/mesa/mesa-26.2.4/subprojects/
          if-no-files-found: warn
