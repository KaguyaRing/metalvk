name: macOS native build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Get fixed kernel SDK
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: acidanthera/MacKernelSDK
          ref: 3f750085caa17ec3a7880f11c11bf4f48cd6a164
          path: target/MacKernelSDK
          persist-credentials: false
      - name: Host tests
        run: |
          make test CONFIG=Debug
          make test CONFIG=Release
          make test CONFIG=Alpha
      - name: Native App and kext
        run: python3 tools/build_macos.py --kernel-sdk target/MacKernelSDK
      - name: No-device diagnostic path
        run: |
          set +e
          target/macos/MetalVK.app/Contents/MacOS/MetalVK --diagnose
          code=$?
          set -e
          test "$code" -eq 2
      - name: Upload development artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: MetalVK-diagnostics-development
          path: |
            target/macos/MetalVK-development.dmg
            target/macos/MetalVK.kext
            target/macos/MetalVK.app
          if-no-files-found: error
