name: Vulkan hardware probes
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel, macos-26-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install toolchain and Vulkan (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libvulkan-dev glslang-tools spirv-tools
      - name: Install toolchain and Vulkan (macOS)
        if: runner.os == 'macOS'
        run: brew install vulkan-headers vulkan-loader glslang spirv-tools
      - name: Compile the hardware probes (no GPU required)
        run: |
          FLAGS="-Wall -Wextra -Wpedantic -Werror -Wconversion -Wshadow -Iinclude -Ivalidation/vulkan"
          LDFLAGS=""
          if [ "$RUNNER_OS" = "macOS" ]; then
            FLAGS="$FLAGS -isystem $(brew --prefix vulkan-headers)/include"
            LDFLAGS="-L$(brew --prefix vulkan-loader)/lib"
          fi
          CFLAGS="-std=c11 -O2 $FLAGS"
          clang $CFLAGS -c src/vk/context.c -o /tmp/context.o
          ar rcs /tmp/libmetalvk-vulkan.a /tmp/context.o
          for unit in compute render input pattern; do
            clang $CFLAGS -c "validation/vulkan/$unit.c" -o "/tmp/$unit.o"
          done
          clang /tmp/compute.o /tmp/input.o /tmp/libmetalvk-vulkan.a $LDFLAGS -lvulkan -o /tmp/vulkan-compute
          clang /tmp/render.o /tmp/input.o /tmp/pattern.o /tmp/libmetalvk-vulkan.a $LDFLAGS -lvulkan -o /tmp/vulkan-render
          clang++ $FLAGS -std=c++17 -x c++ -fsyntax-only include/vk/init.h
      - name: Validate the shaders
        run: |
          for shader in readback.comp pattern.vert pattern.frag; do
            glslangValidator -V --target-env vulkan1.2 \
              -o "/tmp/$shader.spv" "validation/vulkan/shaders/$shader"
            spirv-val --target-env vulkan1.2 "/tmp/$shader.spv"
          done
      - name: Input and pixel regression tests (no GPU required)
        run: |
          clang -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror -Wconversion -Wshadow \
            -fsanitize=address,undefined -fno-sanitize-recover=all -Ivalidation/vulkan \
            tests/test_vulkan_inputs.c validation/vulkan/input.c validation/vulkan/pattern.c \
            -o /tmp/test-vulkan-inputs
          /tmp/test-vulkan-inputs /tmp/readback.comp.spv
