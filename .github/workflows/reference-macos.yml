name: Optional platform reference build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-26-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Get fixed kernel SDK
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: acidanthera/MacKernelSDK
          ref: 3f750085caa17ec3a7880f11c11bf4f48cd6a164
          path: target/MacKernelSDK
          persist-credentials: false
      - name: Get official Vulkan headers
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: KhronosGroup/Vulkan-Headers
          ref: 6802bb4733b63ed5efd3adb308a6c885ef180ea1
          path: target/Vulkan-Headers
          persist-credentials: false
      - name: Vulkan API compile checks (no GPU execution)
        run: |
          clang -std=c11 -Wall -Wextra -Wpedantic -Werror -Wconversion -Wshadow -Iinclude -Ivalidation/vulkan -Ivalidation/common -isystem target/Vulkan-Headers/include -fsyntax-only src/vk/context.c src/vk/offscreen.c validation/vulkan/compute.c validation/vulkan/render.c
          clang++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -Iinclude -isystem target/Vulkan-Headers/include -x c++ -fsyntax-only include/vk/init.h
      - name: Host tests
        run: |
          make test CONFIG=Debug
          make test CONFIG=Release
          make test CONFIG=Alpha
          make test-nvidia CONFIG=Debug
          make test-nvidia CONFIG=Release
          make test-nvidia CONFIG=Alpha
      - name: Native App and kext
        run: |
          sw_vers
          uname -m
          python3 tools/build_macos.py --kernel-sdk target/MacKernelSDK
      - name: No-device diagnostic path
        run: |
          set +e
          target/macos/MetalVK.app/Contents/MacOS/MetalVK --diagnose
          code=$?
          set -e
          test "$code" -eq 2
      - name: System Metal discovery and argument checks (no rendering claim)
        run: |
          target/macos/metal-render --list-devices
          set +e
          target/macos/metal-render --registry-id invalid
          code=$?
          set -e
          test "$code" -eq 64
      - name: Apple virtual Metal reference render (not metalvk support)
        run: |
          registry=$(target/macos/metal-render --list-devices | sed -n 's/^Metal device: Apple Paravirtual device registry-id=\(0x[0-9a-f]*\)$/\1/p')
          if [ -n "$registry" ]; then
            echo "Validating the acceptance client against Apple's virtual reference device only."
            MTL_DEBUG_LAYER=1 target/macos/metal-render --registry-id "$registry"
          else
            echo "Apple virtual reference device unavailable; no reference render coverage."
          fi
      - name: Upload development artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: MetalVK-diagnostics-development-${{ matrix.os }}
          path: |
            target/macos/MetalVK-development.dmg
            target/macos/MetalVK.kext
            target/macos/MetalVK.app
            target/macos/libmetalvk-kernel-platform.a
            target/macos/metal-render
          if-no-files-found: error
