name: Optional platform reference build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Get fixed kernel SDK
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: acidanthera/MacKernelSDK
          ref: 3f750085caa17ec3a7880f11c11bf4f48cd6a164
          path: target/MacKernelSDK
          persist-credentials: false
      - name: Get official Vulkan headers
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: KhronosGroup/Vulkan-Headers
          ref: 6802bb4733b63ed5efd3adb308a6c885ef180ea1
          path: target/Vulkan-Headers
          persist-credentials: false
      - name: Vulkan API compile checks (no GPU execution)
        run: |
          clang -std=c11 -Wall -Wextra -Wpedantic -Werror -Wconversion -Wshadow -Iinclude -Ivalidation/vulkan -isystem target/Vulkan-Headers/include -fsyntax-only validation/vulkan/context.c validation/vulkan/compute.c
          clang++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -Iinclude -isystem target/Vulkan-Headers/include -x c++ -fsyntax-only validation/vulkan/context.h
      - name: Host tests
        run: |
          make test CONFIG=Debug
          make test CONFIG=Release
          make test CONFIG=Alpha
      - name: Native App and kext
        run: python3 tools/build_macos.py --kernel-sdk target/MacKernelSDK
      - name: No-device diagnostic path
        run: |
          set +e
          target/macos/MetalVK.app/Contents/MacOS/MetalVK --diagnose
          code=$?
          set -e
          test "$code" -eq 2
      - name: Upload development artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: MetalVK-diagnostics-development
          path: |
            target/macos/MetalVK-development.dmg
            target/macos/MetalVK.kext
            target/macos/MetalVK.app
          if-no-files-found: error
