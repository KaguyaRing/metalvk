name: Optional platform reference build
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      release_tag:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-26-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Get fixed kernel SDK
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: acidanthera/MacKernelSDK
          ref: 3f750085caa17ec3a7880f11c11bf4f48cd6a164
          path: target/MacKernelSDK
          persist-credentials: false
      - name: Get official Vulkan headers
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: KhronosGroup/Vulkan-Headers
          ref: 6802bb4733b63ed5efd3adb308a6c885ef180ea1
          path: target/Vulkan-Headers
          persist-credentials: false
      - name: Vulkan API compile checks (no GPU execution)
        run: |
          clang -std=c11 -Wall -Wextra -Wpedantic -Werror -Wconversion -Wshadow -Iinclude -Ivalidation/vulkan -Ivalidation/common -isystem target/Vulkan-Headers/include -fsyntax-only src/vk/context.c src/vk/offscreen.c validation/vulkan/compute.c validation/vulkan/render.c
          clang++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -Iinclude -isystem target/Vulkan-Headers/include -x c++ -fsyntax-only include/vk/init.h
      - name: Host tests
        run: |
          make test CONFIG=Debug
          make test CONFIG=Release
          make test CONFIG=Alpha
          make test-nvidia CONFIG=Debug
          make test-nvidia CONFIG=Release
          make test-nvidia CONFIG=Alpha
      - name: Native App and kext
        run: |
          sw_vers
          uname -m
          python3 tools/build_macos.py --kernel-sdk target/MacKernelSDK
      - name: No-device diagnostic path
        run: |
          set +e
          target/macos/MetalVK.app/Contents/MacOS/MetalVK --diagnose
          code=$?
          set -e
          test "$code" -eq 2
      - name: System Metal discovery and argument checks (no rendering claim)
        run: |
          target/macos/metal-render --list-devices
          set +e
          target/macos/metal-render --registry-id invalid
          code=$?
          set -e
          test "$code" -eq 64
      - name: Apple virtual Metal reference render (not metalvk support)
        run: |
          registry=$(target/macos/metal-render --list-devices | sed -n 's/^Metal device: Apple Paravirtual device registry-id=\(0x[0-9a-f]*\)$/\1/p')
          if [ -n "$registry" ]; then
            echo "Validating the acceptance client against Apple's virtual reference device only."
            MTL_DEBUG_LAYER=1 target/macos/metal-render --registry-id "$registry"
          else
            echo "Apple virtual reference device unavailable; no reference render coverage."
          fi
      - name: Upload development artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: MetalVK-diagnostics-development-${{ matrix.os }}
          path: |
            target/macos/MetalVK-development.dmg
            target/macos/MetalVK.kext
            target/macos/MetalVK.app
            target/macos/libmetalvk-kernel-platform.a
            target/macos/metal-render
          if-no-files-found: error
      - name: Package development release preserving bundle permissions
        if: inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          BUILD_HOST: ${{ matrix.os }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, shutil, subprocess
          tag, host, sha = (os.environ[key] for key in ('RELEASE_TAG', 'BUILD_HOST', 'SOURCE_SHA'))
          if tag != 'v0.1.0' and not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+-[0-9a-f]{7}', tag):
              raise SystemExit('Invalid release tag')
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('Invalid source SHA')
          if subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() != sha:
              raise SystemExit('Source checkout does not match the resolved tag')
          stage = pathlib.Path('target/release-stage')
          stage.mkdir()
          build = pathlib.Path('target/macos')
          for name in ('MetalVK.kext', 'MetalVK.app'):
              subprocess.run(['codesign', '--verify', '--strict', str(build / name)], check=True)
              shutil.copytree(build / name, stage / name, symlinks=True)
          for name in ('LICENSE', 'README.md', 'README_ZN.md'):
              shutil.copy2(name, stage / name)
          shutil.copy2(build / 'MetalVK-development.dmg', stage / 'MetalVK-development.dmg')
          metadata = {'tag': tag, 'source_sha': sha, 'build_host': host,
                      'os_build': subprocess.check_output(['sw_vers', '-buildVersion'], text=True).strip(),
                      'kernel_sdk_sha': '3f750085caa17ec3a7880f11c11bf4f48cd6a164',
                      'architecture': 'x86_64', 'signature': 'ad-hoc',
                      'capability': 'read-only PCI diagnostics', 'kext_loaded': False,
                      'gpu_execution_verified': False, 'metalvk_rendering_verified': False}
          (stage / 'BUILD.json').write_text(json.dumps(metadata, indent=2) + '\n', encoding='utf-8')
          (stage / 'DEVELOPMENT.txt').write_text(
              'Development diagnostics only. Not a usable GPU driver.\n'
              'Ad-hoc signed; not notarized. No automatic install or load.\n'
              'NVIDIA 10de:28e0 only; read-only BAR0 probe disabled by default.\n'
              'No verified macOS GPU execution, Metal acceleration or display support.\n', encoding='utf-8')
          output = pathlib.Path('target/release-packages')
          output.mkdir()
          archive = output / f'MetalVK-{tag}-development-{host}.zip'
          subprocess.run(['ditto', '-c', '-k', '--sequesterRsrc', '--keepParent', str(stage), str(archive)], check=True)
          with archive.open('rb') as stream:
              digest = hashlib.file_digest(stream, 'sha256').hexdigest()
          (output / (archive.name + '.sha256')).write_text(f'{digest}  {archive.name}\n', encoding='ascii')
          PY
      - name: Upload packaged release
        if: inputs.release_tag != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: metalvk-release-${{ matrix.os }}
          path: target/release-packages/*
          if-no-files-found: error
