name: Build and publish development release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing development tag (legacy v0.1.0 or vMAJOR.MINOR.PATCH-shortsha)
        required: true
        default: v0.1.0
        type: string
permissions:
  contents: read
concurrency:
  group: development-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: source
        name: Validate and resolve the immutable source tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          tag = os.environ['RELEASE_TAG']
          if tag != 'v0.1.0' and not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+-[0-9a-f]{7}', tag):
              raise SystemExit('Expected a development tag with a short commit suffix')
          sha = subprocess.check_output(['git', 'rev-parse', '--verify', f'refs/tags/{tag}^{{commit}}'], text=True).strip()
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('Invalid resolved commit')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
              stream.write(f'tag={tag}\nsha={sha}\n')
          print(f'Building {tag} from {sha}; no tag is created or moved')
          PY
  build:
    needs: resolve
    uses: ./.github/workflows/reference-macos.yml
    with:
      source_sha: ${{ needs.resolve.outputs.sha }}
      release_tag: ${{ needs.resolve.outputs.tag }}
  publish:
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Download both native release packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: metalvk-release-*
          path: target/release
          merge-multiple: true
      - name: Publish only verified packages as a prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
        run: python3 tools/publish_development_release.py --assets target/release
